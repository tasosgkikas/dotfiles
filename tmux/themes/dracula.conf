# Far-left icon options: smiley, session, window, or any character.
set -g @dracula-show-left-icon session
# Angled widget dividers
set -g @dracula-show-powerline true
# Available plugins:
# battery, cpu-usage, git, gpu-usage, ram-usage, tmux-ram-usage, network, network-bandwidth, network-ping, ssh-session, attached-clients, network-vpn, weather, time, mpc, spotify-tui, krbtgt, playerctl, kubernetes-context, synchronize-panes
set -g @dracula-plugins "git cpu-usage ram-usage"

run '~/.tmux/themes/dracula/dracula.tmux'