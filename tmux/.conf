# ==========================
# SECTION 1: Base Settings & Keybindings
# (Put all your new configurations here)
# ==========================

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reload tmux config with Prefix + r
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"


# ==========================
# SECTION 2: Plugins
# ==========================
# 1. Uninstall deactivated plugin(s) with Prefix + Alt-u
# 2. Install new plugin(s) with Prefix + Shift-i (capital "i")

set -g @plugin 'tmux-plugins/tpm'

# Save session with Prefix + Ctrl-s, restore with Prefix + Ctrl-r
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Automatically saves the session every 15 minutes
set -g @plugin 'tmux-plugins/tmux-continuum'
# Automatically restore the last saved session when tmux is started
set -g @continuum-restore 'on'
# Add custom programs to the resurrect list
# set -g @resurrect-processes 'ssh psql mysql sqlite3 my_custom_script.py "~/.local/bin/my-script.sh"'

# Unsets theme variables before loading the selected theme
source-file ~/.tmux/themes/unset-vars.conf

# Status bar themes (leave uncommented only the desirable)
source-file ~/.tmux/themes/dracula.conf
#source-file ~/.tmux/themes/catppuccin.conf


# ==========================
# Section 3: Machine-Specific Local Overrides
# (Must be before TPM initialization!)
# ==========================
source-file -q ~/.tmux.conf.local


# ==========================
# SECTION 4: Initialize TPM
# (Strictly the last line of the file!)
# ==========================
run '~/.tmux/plugins/tpm/tpm'

# After any changes, reload tmux config with Prefix + r or run the following command:
# tmux source ~/.tmux.conf